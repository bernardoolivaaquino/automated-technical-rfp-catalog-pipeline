[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-technical-rfp-catalog-pipeline"
version = "1.0.0"
description = "Deterministic Python pipeline for normalizing dirty bilingual aerospace/industrial catalogs (CSV/PDF), validating engineering tolerances, and generating RFP compliance matrices in Markdown and LaTeX."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Bernardo Oliva Aquino" }
]
keywords = [
  "technical-documentation",
  "rfp-compliance",
  "data-operations",
  "aerospace",
  "pydantic",
  "latex",
  "docs-as-code",
]
dependencies = [
  "pydantic>=2.0",
  "pymupdf>=1.24",
  "jinja2>=3.1",
  "rapidfuzz>=3.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rfp-pipeline = "src.pipeline:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
